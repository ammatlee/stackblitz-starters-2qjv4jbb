name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Tes (vitest)
        run: npm test
      - name: Tipe kode aplikasi
        run: npx tsc --noEmit
      - name: Tipe kode tes (belum memblokir)
        run: npx tsc -p tsconfig.typecheck.json
        continue-on-error: true
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build